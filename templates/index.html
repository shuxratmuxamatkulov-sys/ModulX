<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ModulX - ERP Tizimi</title>
    <!-- Tailwind CSS (CDN orqali) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 font-sans">

    <!-- LOGIN SHAKLI (Autorizatsiya bo'lmaganda ko'rinadi) -->
    <div id="login-section" class="min-h-screen flex items-center justify-center bg-slate-900 px-4">
        <div class="max-w-md w-full bg-white rounded-xl shadow-2xl p-8 space-y-6">
            <div class="text-center">
                <h1 class="text-3xl font-extrabold text-slate-800">ModulX ERP</h1>
                <p class="text-slate-500 text-sm mt-1">Tizimga kirish uchun login va parolni kiriting</p>
            </div>

            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700">Foydalanuvchi nomi</label>
                    <input type="text" id="username" required class="mt-1 w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700">Parol</label>
                    <input type="password" id="password" required class="mt-1 w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div id="login-error" class="text-red-500 text-sm hidden">Login yoki parol xato!</div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg transition duration-200">
                    Kirish
                </button>
            </form>
        </div>
    </div>

    <!-- MAIN DASHBOARD (Autorizatsiya bo'lganda ko'rinadi) -->
    <div id="dashboard-section" class="hidden min-h-screen flex flex-col">
        <!-- Yuqori menyu (Navbar) -->
        <header class="bg-slate-800 text-white shadow-md">
            <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <span class="text-xl font-bold tracking-wide">ModulX ERP</span>
                    <span class="bg-blue-600 text-xs px-2 py-1 rounded">Fen Textile</span>
                </div>
                <div class="flex items-center space-x-4">
                    <span id="user-display" class="text-sm font-medium text-slate-300">Foydalanuvchi</span>
                    <button id="logout-btn" class="bg-red-600 hover:bg-red-700 text-xs px-3 py-1.5 rounded transition">
                        Chiqish
                    </button>
                </div>
            </div>
        </header>

        <!-- Asosiy ishchi maydon -->
        <main class="flex-1 max-w-7xl w-full mx-auto p-6 grid grid-cols-1 md:grid-cols-3 gap-6">

            <!-- Ip Qo'shish Shakli -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                    <i class="fa-solid font-bold fa-plus text-blue-600"></i> Yangi Ip Kirim Qilish
                </h2>
                <form id="add-yarn-form" class="space-y-3">
                    <div>
                        <label class="text-xs font-semibold text-slate-600">Ip nomi</label>
                        <input type="text" id="yarn-name" required placeholder="Masalan: Paxta 30/1" class="w-full border p-2 rounded text-sm focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-slate-600">Ip raqami / Titr</label>
                        <input type="text" id="yarn-title" required placeholder="Masalan: 30/1" class="w-full border p-2 rounded text-sm focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-slate-600">Mog'dor (kg)</label>
                        <input type="number" step="0.01" id="yarn-qty" required placeholder="500.00" class="w-full border p-2 rounded text-sm focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-slate-600">Yetkazib beruvchi</label>
                        <input type="text" id="yarn-supplier" required placeholder="Ipak Yo'li MChJ" class="w-full border p-2 rounded text-sm focus:outline-none focus:border-blue-500">
                    </div>
                    <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white text-sm font-bold py-2 rounded transition">
                        Saqlash
                    </button>
                </form>
            </div>

            <!-- Ombor Qoldiqlari Jadvali -->
            <div class="md:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                        <i class="fa-solid fa-boxes-stacked text-blue-600"></i> Ip Ombori Qoldiqlari
                    </h2>
                    <button id="refresh-yarns" class="text-slate-500 hover:text-blue-600 text-sm">
                        <i class="fa-solid fa-rotate"></i> Yangilash
                    </button>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-50 text-slate-600 text-xs uppercase border-b">
                                <th class="p-3">ID</th>
                                <th class="p-3">Nomi</th>
                                <th class="p-3">Titr</th>
                                <th class="p-3">Mog'dor (kg)</th>
                                <th class="p-3">Etkazib Beruvchi</th>
                            </tr>
                        </thead>
                        <tbody id="yarn-table-body" class="text-sm divide-y text-slate-700">
                            <!-- JS orqali to'ldiriladi -->
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>

    <!-- JS faylni ulash -->
    <script src="/static/js/app.js"></script>
</body>
</html>
